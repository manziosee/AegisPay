name: Deploy API to Fly.io

on:
  push:
    branches: [main]
    paths:
      - 'backend/go/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once, and never cancel one half-way.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  test:
    name: Test API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache-dependency-path: backend/go/go.sum
      - run: go vet ./...
      - run: go test -count=1 ./...

  deploy:
    name: Deploy to Fly.io
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://aegispay.fly.dev/docs
    defaults:
      run:
        working-directory: backend/go
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Smoke test
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS https://aegispay.fly.dev/health/ready; then
              curl -fsS -o /dev/null https://aegispay.fly.dev/openapi.yaml
              echo; echo "API is ready."
              exit 0
            fi
            sleep 6
          done
          echo "API did not become ready after deploy." >&2
          exit 1
