name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Go API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go/go.sum
      - name: Check formatting of new and maintained files
        run: |
          unformatted=$(gofmt -l cmd/api/client_ip.go cmd/api/close_period_guard.go cmd/api/docs.go cmd/api/maintenance.go cmd/api/reconciliation_import.go cmd/api/secret_box.go cmd/api/webhooks.go cmd/api/rate_limit.go)
          if [ -n "$unformatted" ]; then echo "Run gofmt on: $unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -count=1 ./...

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser workflows (mocked API)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/dashboard/test-results
          retention-days: 7
