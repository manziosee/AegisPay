name: Container build and scan

# The image build and scan is the slowest job, so it runs on pull requests,
# weekly (new CVEs appear without code changes), and on demand.
on:
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend/go
          load: true
          tags: aegispay-api:ci
      - uses: docker/build-push-action@v6
        with:
          context: ./backend/python/fraud
          load: true
          tags: aegispay-fraud:ci
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aegispay-api:ci
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aegispay-fraud:ci
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
