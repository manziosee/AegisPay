apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: {app: redis}
  ports: [{name: redis, port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: redis
          image: redis:7-alpine
          command: [sh, -c]
          args: ['exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"']
          env:
            - {name: REDIS_PASSWORD, valueFrom: {secretKeyRef: {name: aegispay-secrets, key: REDIS_PASSWORD}}}
          ports: [{containerPort: 6379}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          readinessProbe: {exec: {command: [sh, -c, 'redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG']}}
