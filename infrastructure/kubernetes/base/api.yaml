apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: api}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: aegispay-api:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env:
            - {name: HTTP_ADDR, value: ":8080"}
            - {name: SWAGGER_ORIGIN, value: "http://localhost:8081"}
            - {name: POSTGRES_DB, value: aegispay}
            - {name: APP_DB_USER, value: aegispay_app}
            - {name: APP_DB_PASSWORD, valueFrom: {secretKeyRef: {name: aegispay-secrets, key: APP_DB_PASSWORD}}}
            - {name: AEGIS_API_KEY, valueFrom: {secretKeyRef: {name: aegispay-secrets, key: AEGIS_API_KEY}}}
            - {name: WEBHOOK_ENCRYPTION_KEY, valueFrom: {secretKeyRef: {name: aegispay-secrets, key: WEBHOOK_ENCRYPTION_KEY}}}
            - {name: AEGIS_ORGANIZATION_ID, value: org_sandbox}
            - {name: FRAUD_SERVICE_URL, value: "http://fraud:8090"}
            - {name: REDIS_PASSWORD, valueFrom: {secretKeyRef: {name: aegispay-secrets, key: REDIS_PASSWORD}}}
            - {name: REDIS_URL, value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"}
            - {name: DATABASE_URL, value: "postgres://$(APP_DB_USER):$(APP_DB_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable"}
          readinessProbe: {httpGet: {path: /health/ready, port: 8080}}
          livenessProbe: {httpGet: {path: /health/live, port: 8080}}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
