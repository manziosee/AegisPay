apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aegispay
resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - api.yaml
  - fraud.yaml
  - swagger.yaml
  - network-policy.yaml
  - prometheus.yaml
configMapGenerator:
  - name: aegispay-openapi
    files:
      - openapi.yaml=openapi.yaml
  - name: prometheus-config
    files:
      - prometheus.yml=prometheus.yml
  - name: postgres-init
    files:
      - 001-security.sh=postgres-init.sh
