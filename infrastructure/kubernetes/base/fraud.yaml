apiVersion: v1
kind: Service
metadata:
  name: fraud
spec:
  selector: {app: fraud}
  ports: [{name: http, port: 8090, targetPort: 8090}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud
spec:
  replicas: 1
  selector: {matchLabels: {app: fraud}}
  template:
    metadata: {labels: {app: fraud}}
    spec:
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: fraud
          image: aegispay-fraud:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8090}]
          readinessProbe: {httpGet: {path: /health/live, port: 8090}}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
