name: aegispay

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_DB_USER: ${APP_DB_USER:?Set APP_DB_USER in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 15
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ./backend/go
    restart: unless-stopped
    environment:
      HTTP_ADDR: :8080
      SWAGGER_ORIGIN: http://localhost:8081
      DATABASE_URL: postgres://${APP_DB_USER:?Set APP_DB_USER in .env}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}?sslmode=disable
      AEGIS_API_KEY: ${AEGIS_API_KEY:?Set AEGIS_API_KEY in .env}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-}
      ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:-}
      TRUSTED_PROXY_SECRET: ${TRUSTED_PROXY_SECRET:-}
      AEGIS_ORGANIZATION_ID: ${AEGIS_ORGANIZATION_ID:-org_sandbox}
      FRAUD_SERVICE_URL: http://fraud:8090
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
    ports:
      - "127.0.0.1:${API_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      fraud:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [data, egress]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "/aegispay-api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  dashboard:
    build:
      context: ./apps/dashboard
      args:
        API_PROXY_TARGET: http://api:8080
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      API_PROXY_TARGET: http://api:8080
      TRUSTED_PROXY_SECRET: ${TRUSTED_PROXY_SECRET:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks: [data, egress]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  fraud:
    build:
      context: ./backend/python/fraud
    restart: unless-stopped
    expose: ["8090"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health/live', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [data]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  swagger:
    image: swaggerapi/swagger-ui:v5.18.2
    restart: unless-stopped
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
      URLS_PRIMARY_NAME: AegisPay API
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./docs/api/openapi.yaml:/spec/openapi.yaml:ro
    networks: [data, egress]
    security_opt: [no-new-privileges:true]


  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [data, egress]
    security_opt: [no-new-privileges:true]


networks:
  data:
    internal: true
  egress:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
